[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-dino"
version = "0.1.0"
description = "Field-token DINO features and attention for gridded radar NetCDF files"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Daniel Wefer"},
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "xarray>=2023.1",
]

[project.optional-dependencies]
netcdf = [
    "h5netcdf>=1.2",
    "netCDF4>=1.6",
]
hub = [
    "huggingface-hub>=0.24",
    "safetensors>=0.4",
]
analysis = [
    "hdbscan>=0.8",
    "joblib>=1.3",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
]
dev = [
    "build>=1.2",
    "pytest>=7",
    "pytest-cov>=4",
]

[project.scripts]
radar-dino = "radar_dino.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
markers = [
    "unit: fast CPU-only tests with synthetic inputs",
    "integration: tests that cross module or file-format boundaries",
    "gpu: tests that require a CUDA-capable GPU",
]
